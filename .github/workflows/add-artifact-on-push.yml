on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: ./my_file.txt
          retention-days: 1